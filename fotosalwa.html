<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Kenangan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffeef2;
            color: #4a4a4a;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #d1497b;
            margin-bottom: 30px;
        }
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .photo-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 250px;
            transition: transform 0.3s;
        }
        .photo-card:hover {
            transform: scale(1.05);
        }
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .photo-card p {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }
        .nav-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 24px;
            background-color: #d1497b;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background-color: #b33663;
        }
    </style>
</head>
<body>

    <h1>📸 Galeri Foto & Kenangan Salwa 🌟</h1>

    <div class="gallery-container">
        <!-- Kartu Foto 1 -->
        <div class="photo-card">
            <img src="https://unsplash.com" alt="Foto 1">
            <p>✨ Momen spesial pertama kita saat itu...</p>
        </div>

        <!-- Kartu Foto 2 -->
        <div class="photo-card">
            <img src="https://unsplash.com" alt="Foto 2">
            <p>🎂 Hari di mana tawa kamu paling cerah!</p>
        </div>

        <!-- Kartu Foto 3 -->
        <div class="photo-card">
            <img src="https://unsplash.com" alt="Foto 3">
            <p>💖 Selalu bersyukur ada kamu di hidupku.</p>
        </div>
    </div>

    <!-- Tombol untuk kembali ke halaman utama -->
    <br>
    <a href="index.html" class="nav-btn">🏠 Kembali ke Halaman Utama</a>

</body>
</html>
